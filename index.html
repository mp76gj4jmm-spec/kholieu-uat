<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KhoLieu UAT</title>
<style>
*{box-sizing:border-box}html,body{margin:0;font-family:Segoe UI,sans-serif;background:#eef1f4;color:#1c242c}
.screen{display:none;min-height:100vh}.screen.on{display:block}
.login{min-height:100vh;background:#3d5d70}
.bar{height:6px;background:#c0392b}
.card-wrap{min-height:calc(100vh - 6px);display:flex;align-items:center;justify-content:center;padding:48px 16px}
.card{width:100%;max-width:352px;border-radius:16px;padding:32px 28px;color:#fff;background:#3e6a86}
.card h1{margin:0}label{display:block;margin-top:16px}
input,select{width:100%;height:44px;border:0;border-radius:8px;padding:0 12px;margin-top:6px}
.pwbox{margin-top:10px;padding:8px;border-radius:8px;background:rgba(255,255,255,.16);font-family:monospace;font-size:12px}
.err{margin-top:8px;color:#fecaca;min-height:20px}
.login-btn{margin-top:18px;width:100%;height:44px;border:0;border-radius:8px;background:#fff;color:#1d4f86;font-weight:600;cursor:pointer}
.topbar{display:flex;justify-content:space-between;align-items:center;height:56px;padding:0 16px;background:#1f4b63;color:#fff}
.chip,.btn{height:36px;padding:0 12px;border-radius:6px;border:1px solid #d5dde4;background:#fff;cursor:pointer}
.chip{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.btn.primary{background:#1f4b63;color:#fff;border-color:#1f4b63}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;padding:12px 16px;background:#fff;border-bottom:1px solid #d5dde4}
.pane{padding:16px}.banner{background:#e8eef2;padding:10px;border-radius:6px}
</style>
</head>
<body>
<section id="login" class="screen login on">
  <div class="bar"></div>
  <div class="card-wrap">
    <form class="card" onsubmit="return goIn()">
      <h1>Sign in</h1>
      <p>UAT · LOCKED</p>
      <label>User name
        <select id="user"><option value="Admin" selected>Admin</option></select>
      </label>
      <label>Password
        <input id="password" type="password" autocomplete="current-password" />
      </label>
      <div class="pwbox">Password: KhoLieu-UAT-2026</div>
      <p class="err" id="err"></p>
      <button class="login-btn" type="submit">Log in</button>
    </form>
  </div>
</section>
<section id="studio" class="screen">
  <header class="topbar">
    <div>KhoLiệu</div>
    <button class="chip" type="button" onclick="goOut()">Đăng xuất</button>
  </header>
  <div class="toolbar">
    <label>Tên báo cáo <input id="title" placeholder="Admin tự đặt tên" /></label>
    <label class="btn primary">Nhập file<input id="file-in" type="file" multiple hidden accept=".xlsx,.xls,.csv,.txt,.tsv" /></label>
    <button class="btn" type="button" id="btn-clear">Xóa dữ liệu</button>
  </div>
  <div class="pane">
    <p class="banner" id="data-flag">Đã đăng nhập. Bấm Nhập file để bắt đầu.</p>
    <p>Số dòng: <b id="k-rows">0</b></p>
    <div style="overflow:auto;background:#fff;border:1px solid #d5dde4">
      <table id="grid" border="1" cellpadding="4" style="border-collapse:collapse;width:100%"></table>
    </div>
    <p style="margin-top:16px">Phân tích</p>
    <textarea id="q" style="width:100%;min-height:80px"></textarea>
    <button class="btn primary" type="button" id="btn-ask">Chạy phân tích</button>
    <p id="answer"></p>
  </div>
</section>
<script>
function show(id){
  document.querySelectorAll(".screen").forEach(function(el){ el.classList.remove("on"); });
  document.getElementById(id).classList.add("on");
}
function goIn(){
  var pass = (document.getElementById("password").value || "").replace(/^\s+|\s+$/g,"");
  var box = document.getElementById("err");
  if (pass !== "KhoLieu-UAT-2026") {
    box.textContent = "Sai mật khẩu. Gõ đúng: KhoLieu-UAT-2026";
    return false;
  }
  box.textContent = "";
  try { sessionStorage.setItem("kholieu-in","1"); } catch(e) {}
  show("studio");
  return false;
}
function goOut(){
  try { sessionStorage.removeItem("kholieu-in"); } catch(e) {}
  document.getElementById("password").value = "";
  show("login");
}
try { if (sessionStorage.getItem("kholieu-in") === "1") show("studio"); } catch(e) {}
</script>
<script>
(function(){
  var pack = {cols:[], rows:[]};
  function cell(v){ return (v==null?"":String(v)).replace(/</g,"<"); }
  function draw(){
    document.getElementById("k-rows").textContent = String(pack.rows.length);
    document.getElementById("data-flag").textContent = pack.rows.length ? ("Đã nhập " + pack.rows.length + " dòng.") : "Đã đăng nhập. Bấm Nhập file để bắt đầu.";
    var h = pack.cols.length ? ("<tr>" + pack.cols.map(function(c){return "<th>"+cell(c)+"</th>";}).join("") + "</tr>") : "";
    var b = pack.rows.slice(0,80).map(function(r){ return "<tr>" + pack.cols.map(function(_,i){return "<td>"+cell(r[i])+"</td>";}).join("") + "</tr>"; }).join("");
    document.getElementById("grid").innerHTML = h + b;
  }
  document.getElementById("file-in").onchange = function(ev){
    var files = ev.target.files; if (!files || !files[0]) return;
    var reader = new FileReader();
    reader.onload = function(){
      var text = String(reader.result||"").replace(/^\uFEFF/,"");
      var lines = text.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean);
      if (!lines.length) return;
      var delim = lines[0].indexOf("\t")>=0 ? "\t" : ",";
      pack.cols = lines[0].split(delim);
      pack.rows = lines.slice(1).map(function(line){ return line.split(delim); });
      draw();
    };
    reader.readAsText(files[0]);
    ev.target.value = "";
  };
  document.getElementById("btn-clear").onclick = function(){ pack = {cols:[], rows:[]}; draw(); };
  document.getElementById("btn-ask").onclick = function(){
    document.getElementById("answer").textContent = pack.rows.length ? ("COUNT() = " + pack.rows.length) : "Chưa nhập file.";
  };
})();
</script>
</body></html>
